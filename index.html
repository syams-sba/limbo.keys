      <h1>limbo.keys</h1>
      <p>Enter a destination to create a challenge link.</p>
      <p class="generator-note">
        Use an <strong>https:// or http://</strong> link
      </p>
      <form id="generator-form">
        <input
          id="destination-input"
          type="url"
          placeholder="https://example.com"
          autocomplete="off"
          required
        />
        <button type="submit">CREATE LINK</button>
      </form>
      <div id="generated-link" hidden>
        <input id="link-output" type="text" readonly />
        <button id="copy-link" type="button">COPY</button>
