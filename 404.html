<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Loading</title>
</head>
<body>
<script>
	const marker = '/limbo.keys/';
	const markerIndex = window.location.pathname.indexOf(marker);
	const targetPath = window.location.pathname.slice(markerIndex + marker.length);
	const target = targetPath + window.location.search + window.location.hash;
	const appUrl = markerIndex === -1
		? marker
		: window.location.pathname.slice(0, markerIndex + marker.length);

	window.location.replace(
		appUrl + (targetPath ? '#target=' + encodeURIComponent(target) : '')
	);
</script>
</body>
</html>
