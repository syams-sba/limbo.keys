<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Loading</title>
</head>
<body>
<script>
	const marker = '/limbo.keys/';
	const markerIndex = window.location.pathname.indexOf(marker);
	const targetPath = markerIndex === -1
		? window.location.pathname.replace(/^\/+/, '')
		: window.location.pathname.slice(markerIndex + marker.length);
	const appUrl = markerIndex === -1
		? '/'
		: window.location.pathname.slice(0, markerIndex + marker.length);
	const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(targetPath);

	window.location.replace(
		appUrl + (isUuid ? '#link=' + encodeURIComponent(targetPath) : '')
	);
</script>
</body>
</html>
